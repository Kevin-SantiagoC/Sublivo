<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Marcas · Sublivo, tu esencia, tu estilo</title>
    <meta
      name="description"
      content="Réplicas 1.1 de perfumes originales en Tunja, con envíos a todo el país. Hombre, mujer y por marca."
    />
    <link rel="icon" href="img/favicon.png" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="marcas">
    <!-- Barra de anuncio -->
    <div class="announce">Envío gratis en Tunja · Envíos a todo el país</div>
    <!-- Menú principal -->
    <nav class="nav">
      <div class="wrap">
        <a class="logo" href="index.html"><img src="img/logo.png" alt="Sublivo" /></a>
        <div class="links">
          <a href="index.html">Inicio</a>
          <a href="hombre.html">Hombre</a>
          <a href="mujer.html">Mujer</a>
          <a href="marcas.html" class="on">Marcas</a>
        </div>
        <button class="cartbtn" data-a="open">Carrito (<span class="cartn">0</span>)</button>
      </div>
    </nav>
    <!-- Encabezado de la página -->
    <header class="pagehead">
      <i class="blob b1"></i>
      <div class="wrap">
        <img class="wm" src="img/iso-crema.png" alt="" />
        <h1>Por marca</h1>
        <p id="n">136 perfumes</p>
      </div>
    </header>
    <!-- Catálogo de perfumes -->
    <main class="wrap">
      <div class="pills" id="pills"></div>
      <div class="tools">
        <input id="q" type="search" placeholder="Buscar perfume o marca" aria-label="Buscar" />
        <select id="s" aria-label="Ordenar">
          <option value="">Orden del catálogo</option>
          <option value="asc">Precio: menor a mayor</option>
          <option value="desc">Precio: mayor a menor</option>
        </select>
      </div>
      <div id="grid"></div>
    </main>
    <!-- Pie de página -->
    <footer class="foot">
      <div class="wrap">
        <div>
          <div class="logo"><img src="img/imagotipo.png" alt="Sublivo, tu esencia, tu estilo" /></div>
          <p>
            Réplicas 1.1 de perfumes originales, con excelente calidad y muy buena fijación. Estamos en Tunja, Boyacá. ¿No ves tu perfume favorito? Escríbenos y confirmamos su disponibilidad.
          </p>
        </div>
        <div class="links">
          <a href="hombre.html">Hombre</a>
          <a href="mujer.html">Mujer</a>
          <a href="marcas.html">Marcas</a>
        </div>
      </div>
    </footer>
    <!-- Scripts: catálogo de productos y lógica del carrito -->
    <script src="products.js"></script>
    <script src="app.js"></script>
  </body>
</html>
